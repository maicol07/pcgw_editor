name: CI
# Shared pipeline of maicol07/actions: checks on PRs and main, then on main the release PR, and
# once it is merged the GitHub Release and the Pages deploy. A job is overridden by replacing its
# `uses:` with steps of its own (same job name, so `needs` keeps working).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a release half done on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  security:
    uses: maicol07/actions/.github/workflows/security.yml@v1

  commit_lint:
    uses: maicol07/actions/.github/workflows/commit-lint.yml@v1

  # Overrides js.yml: vue-tsc and Vitest (jsdom) fail on the Bun runtime, so the scripts run on
  # Node.js; Bun only installs and runs them.
  # vue-tsc, eslint's Node-only plugins and vitest (jsdom) need the Node.js runtime; bun installs
  # and runs the scripts.
  lint:
    uses: maicol07/actions/.github/workflows/js.yml@v1
    with:
      node_version: '24'
      run: bun run lint

  typecheck:
    uses: maicol07/actions/.github/workflows/js.yml@v1
    with:
      node_version: '24'
      run: bun run typecheck

  tests:
    uses: maicol07/actions/.github/workflows/js.yml@v1
    with:
      node_version: '24'
      run: bun run test --run

  release:
    needs: [security, lint, typecheck, tests]
    if: github.event_name == 'push'
    uses: maicol07/actions/.github/workflows/release.yml@v1
    permissions:
      contents: write
      pull-requests: write

  deploy:
    needs: release
    if: needs.release.outputs.tag
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      ref: ${{ needs.release.outputs.tag }}
