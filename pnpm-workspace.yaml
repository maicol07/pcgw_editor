packages:
  - '.'

# browserslist 4.28.3 shipped a corrupted tarball (truncated node.js, breaks vite build). Pin to 4.28.4.
overrides:
  browserslist: 4.28.4

# @bhsd/codemirror-css-color-picker (pulled in by @bhsd/codemirror-wikitext) imports @lezer/common
# but declares it in neither dependencies nor peerDependencies. Under pnpm's isolated node_modules
# it therefore cannot resolve it, and `vite build` fails with:
#   Rolldown failed to resolve import "@lezer/common" from .../codemirror-css-color-picker/dist/css.js
#
# This is declared here rather than as a root dependency on purpose: we do not import @lezer/common
# ourselves, so a root entry looks unused and invites removal — which is exactly how this broke.
# It only ever appeared to work because a stale copy was left in pnpm's hoisted fallback directory;
# a clean install (CI, Vercel) has no such copy. Verify dependency removals with a fresh install.
packageExtensions:
  '@bhsd/codemirror-css-color-picker':
    dependencies:
      '@lezer/common': ^1.5.2

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.25'
  - '@ai-sdk/gateway@4.0.33'
  - '@ai-sdk/google@4.0.29'
  - '@ai-sdk/openai@4.0.25'
  - '@ai-sdk/provider-utils@5.0.16'
  - '@shikijs/core@4.4.1'
  - '@shikijs/engine-javascript@4.4.1'
  - '@shikijs/engine-oniguruma@4.4.1'
  - '@shikijs/langs@4.4.1'
  - '@shikijs/primitive@4.4.1'
  - '@shikijs/themes@4.4.1'
  - '@shikijs/types@4.4.1'
  - '@vue/language-core@3.3.9'
  - ai@7.0.44
  - shiki@4.4.1
  - vue-tsc@3.3.9
